# Render Blueprint (https://render.com/docs/blueprint-spec)
# Deploy: push the repo to GitHub → render.com/new → connect → Blueprint.
# The Docker image includes Python + yt-dlp, so the YouTube download tool
# works server-side on Render too.
#
# Secrets (`sync: false`) are set once in the Render dashboard after the
# first deploy; leave them blank there if you only use the in-app Settings.
services:
  - type: web
    name: ai-toolbox
    runtime: docker
    repo: https://github.com/bunny123373/AI-Tools
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Required: Auth.js session secret (generate one locally first).
      - key: AUTH_SECRET
        sync: false

      # Trust the Host header (needed for auth callbacks on Render URLs).
      - key: AUTH_TRUST_HOST
        value: "true"

      # Optional: server-side fallback API keys. Users can also paste keys
      # in the app's Settings (browser localStorage) instead.
      - key: XKIRO_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PUTER_AUTH_TOKEN
        sync: false

      # Optional OAuth logins.
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
      - key: AUTH_GITHUB_ID
        sync: false
      - key: AUTH_GITHUB_SECRET
        sync: false

      # Only set if you expose your own Ollama instance at a public URL.
      - key: OLLAMA_BASE_URL
        sync: false